# FeedMe user-facing configuration.
# Category display order follows the order below.

settings:
  defaultSource: bloomberg-markets
  maxItemsPerFeed: 30
  dataPath: ./public/data

summary:
  contentMaxChars: 5000
  temperature: 0.3
  maxTokens: 500
  unavailableMessages:
    zh: 无法生成摘要。
    en: Unable to generate summary.
  prompt: |
    You are a professional content summarizer. Generate a concise and accurate summary in {{summaryLanguage}}.
    The summary should:
    1. Capture the main points and key information.
    2. Be clear, fluent, and natural in {{summaryLanguage}}.
    3. Stay around 100 words or fewer.
    4. Remain objective and avoid adding opinions.
    5. If the content is empty or lacks useful information, do not invent details.
    6. If the source title or content is in another language, summarize the key information in {{summaryLanguage}}.

    Article title:
    {{title}}

    Article content:
    {{content}}

categories:
  - id: news
    name:
      zh: 财经资讯
      en: Finance News
  - id: blogs
    name:
      zh: 博客
      en: Blogs
  - id: forums
    name:
      zh: 论坛
      en: Forums

sources:

  - id: bloomberg-markets
    name:
      zh: Bloomberg Markets
      en: Bloomberg Markets
    url: https://feeds.bloomberg.com/markets/news.rss
    category: news

    
  - id: bloomberg-technology
    name:
      zh: Bloomberg Technology
      en: Bloomberg Technology
    url: https://feeds.bloomberg.com/technology/news.rss
    category: news

  - id: ruanyifeng
    name:
      zh: 阮一峰的个人网站
      en: Ruanyifeng's Blog
    url: http://www.ruanyifeng.com/blog/atom.xml
    category: blogs

  - id: v2ex-hot
    name:
      zh: V2EX 今日热门
      en: V2EX Hot Today
    url: https://rsshub.rssforever.com/v2ex/topics/hot
    category: forums

  - id: lex-fridman-podcast
    name:
      zh: Lex Fridman Podcast
      en: Lex Fridman Podcast
    url: https://lexfridman.com/feed/podcast/
    category: blogs
